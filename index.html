<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Office Jukebox</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 flex flex-col items-center">

  <div class="max-w-md w-full space-y-4">
    <!-- Header -->
    <header class="text-center py-4 border-b border-slate-800">
      <h1 class="text-2xl font-bold text-indigo-400"><i class="fa-solid fa-music mr-2"></i>Jukebox Kantor</h1>
      <p class="text-xs text-slate-400">Putar & request lagu bersama</p>
    </header>

    <!-- YouTube Player Container -->
    <div class="bg-slate-900 p-2 rounded-xl border border-slate-800 shadow-lg">
      <div class="relative aspect-video w-full rounded-lg overflow-hidden bg-black">
        <div id="player"></div>
      </div>
      <div class="mt-2 text-center">
        <h2 id="nowPlayingTitle" class="text-sm font-semibold truncate text-indigo-300">Belum ada lagu</h2>
        <p id="nowPlayingUser" class="text-xs text-slate-500">-</p>
      </div>
    </div>

    <!-- Form Tambah Lagu -->
    <div class="bg-slate-900 p-4 rounded-xl border border-slate-800 space-y-3">
      <h3 class="text-xs font-bold uppercase text-slate-400 tracking-wider">Tambah Lagu Baru</h3>
      <input type="text" id="userInput" placeholder="Nama Anda (contoh: Budi)" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-sm focus:outline-none focus:border-indigo-500">
      <input type="text" id="linkInput" placeholder="Paste Link YouTube / Shorts" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-sm focus:outline-none focus:border-indigo-500">
      <button onclick="addSong()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2 rounded-lg text-sm transition">
        <i class="fa-solid fa-plus mr-1"></i> Masukkan ke Antrean
      </button>
    </div>

    <!-- Daftar Antrean -->
    <div class="bg-slate-900 p-4 rounded-xl border border-slate-800 space-y-2">
      <div class="flex justify-between items-center mb-2">
        <h3 class="text-xs font-bold uppercase text-slate-400 tracking-wider">Daftar Antrean</h3>
        <button onclick="playNext()" class="text-xs bg-slate-800 hover:bg-slate-700 px-2 py-1 rounded text-indigo-300">
          Skip Lagu <i class="fa-solid fa-forward ml-1"></i>
        </button>
      </div>
      <div id="queueList" class="space-y-2 max-h-48 overflow-y-auto pr-1"></div>
    </div>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    let player;
    let playlist = [];
    let currentIndex = -1;

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        height: '100%',
        width: '100%',
        playerVars: { 'autoplay': 1, 'controls': 1 },
        events: {
          'onStateChange': (e) => { if (e.data === YT.PlayerState.ENDED) playNext(); },
          'onError': () => playNext()
        }
      });
    }

    function extractVideoId(url) {
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|shorts\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    function addSong() {
      const user = document.getElementById('userInput').value.trim() || 'Rekan Kantor';
      const link = document.getElementById('linkInput').value.trim();
      const videoId = extractVideoId(link);

      if (!videoId) return alert('Link YouTube tidak valid!');

      playlist.push({ id: videoId, user: user });
      document.getElementById('linkInput').value = '';
      renderQueue();

      if (currentIndex === -1 || (player && player.getPlayerState() !== YT.PlayerState.PLAYING)) {
        playSong(playlist.length - 1);
      }
    }

    function playSong(index) {
      if (index < 0 || index >= playlist.length) return;
      currentIndex = index;
      const item = playlist[currentIndex];

      if (player && player.loadVideoById) {
        player.loadVideoById(item.id);
      }

      document.getElementById('nowPlayingTitle').innerText = `Video ID: ${item.id}`;
      document.getElementById('nowPlayingUser').innerText = `Req oleh: ${item.user}`;
      renderQueue();
    }

    function playNext() {
      if (currentIndex + 1 < playlist.length) {
        playSong(currentIndex + 1);
      } else {
        document.getElementById('nowPlayingTitle').innerText = 'Antrean Selesai';
        document.getElementById('nowPlayingUser').innerText = '-';
      }
    }

    function renderQueue() {
      const container = document.getElementById('queueList');
      container.innerHTML = '';

      if (playlist.length === 0) {
        container.innerHTML = `<p class="text-xs text-slate-600 text-center py-4">Belum ada antrean lagu.</p>`;
        return;
      }

      playlist.forEach((item, idx) => {
        const isCurrent = idx === currentIndex;
        const div = document.createElement('div');
        div.className = `p-2 rounded-lg text-xs flex justify-between items-center ${isCurrent ? 'bg-indigo-950 border border-indigo-700 text-indigo-200' : 'bg-slate-950 text-slate-400'}`;
        div.innerHTML = `
          <div class="truncate cursor-pointer" onclick="playSong(${idx})">
            <span class="font-bold">${idx + 1}.</span> ID: ${item.id} <span class="text-slate-500">(${item.user})</span>
          </div>
          ${isCurrent ? '<i class="fa-solid fa-volume-high text-indigo-400"></i>' : ''}
        `;
        container.appendChild(div);
      });
    }
  </script>
</body>
</html>
