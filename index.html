<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SNP BERGOYANG</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    body {
      background: linear-gradient(135deg, #0b0f19 0%, #111827 50%, #0b0f19 100%);
      min-height: 100vh;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.6);
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #4f46e5;
      border-radius: 4px;
    }
  </style>
</head>
<body class="text-slate-100 font-sans antialiased min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-slate-900/80 backdrop-blur-md border-b border-slate-800 sticky top-0 z-40 px-4 py-3">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="p-2.5 bg-indigo-600 rounded-xl shadow-lg shadow-indigo-600/30">
          <i class="fa-solid fa-compact-disc text-xl text-white"></i>
        </div>
        <div>
          <h1 class="text-lg md:text-xl font-bold tracking-wide">SNP BERGOYANG</h1>
          <p class="text-[11px] text-slate-400">Pencarian & Real-time Queue</p>
        </div>
      </div>
      
      <div id="statusBadge" class="bg-slate-800/80 text-slate-300 text-xs px-3 py-1.5 rounded-full border border-slate-700 flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        <span>Terhubung</span>
      </div>
    </div>
  </header>

  <!-- Main Grid Layout Responsif -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
    
    <!-- KOLOM KIRI: Pemutar & Input -->
    <section class="lg:col-span-7 space-y-5 lg:sticky lg:top-20">
      
      <!-- Video Player -->
      <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-3 md:p-4 shadow-2xl">
        <div class="relative aspect-video w-full bg-black rounded-xl overflow-hidden border border-slate-800">
          <div id="player"></div>
        </div>

        <div class="mt-3 flex items-center justify-between gap-3">
          <div class="min-w-0 flex-1">
            <h2 id="nowPlayingTitle" class="font-bold text-sm md:text-base truncate text-indigo-300">Belum Ada Lagu Diputar</h2>
            <p id="nowPlayingUser" class="text-xs text-slate-400 mt-0.5">Permintaan: -</p>
          </div>
          <button onclick="playNext()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2.5 rounded-xl font-medium text-xs md:text-sm transition flex items-center gap-2 flex-shrink-0 shadow-lg shadow-indigo-600/20">
            <span>Skip</span> <i class="fa-solid fa-forward text-xs"></i>
          </button>
        </div>
      </div>

      <!-- Form Input & Pencarian -->
      <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-4 md:p-5 shadow-2xl space-y-4">
        
        <!-- Tab Selector -->
        <div class="flex border-b border-slate-800 pb-2 gap-4">
          <button id="tabSearchBtn" onclick="switchTab('search')" class="text-xs md:text-sm font-semibold text-indigo-400 border-b-2 border-indigo-500 pb-1.5 transition flex items-center gap-2">
            <i class="fa-solid fa-magnifying-glass"></i> Cari Judul / Artis
          </button>
          <button id="tabLinkBtn" onclick="switchTab('link')" class="text-xs md:text-sm font-medium text-slate-400 border-b-2 border-transparent pb-1.5 hover:text-slate-200 transition flex items-center gap-2">
            <i class="fa-solid fa-link"></i> Paste Link YouTube
          </button>
        </div>

        <!-- Input Nama -->
        <div>
          <label class="block text-[11px] text-slate-400 uppercase tracking-wider mb-1 font-semibold">Nama Anda / Divisi</label>
          <input type="text" id="userInput" placeholder="Contoh: Budi (IT)" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-xs md:text-sm text-white placeholder-slate-600 focus:outline-none focus:border-indigo-500">
        </div>

        <!-- Mode Pencarian Kata Kunci -->
        <div id="searchMode" class="space-y-3">
          <div class="flex gap-2">
            <input type="text" id="searchInput" onkeypress="if(event.key==='Enter') searchSong()" placeholder="Contoh: Sheila on 7 Dan..." class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-xs md:text-sm text-white placeholder-slate-600 focus:outline-none focus:border-indigo-500">
            <button onclick="searchSong()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl text-xs md:text-sm font-medium transition flex items-center gap-1.5 flex-shrink-0">
              <i class="fa-solid fa-magnifying-glass"></i> Cari
            </button>
          </div>
          <div id="searchResults" class="space-y-2 max-h-52 overflow-y-auto custom-scrollbar pt-1"></div>
        </div>

        <!-- Mode Link YouTube Direct -->
        <div id="linkMode" class="space-y-3 hidden">
          <div class="flex gap-2">
            <input type="text" id="linkInput" placeholder="https://www.youtube.com/watch?v=..." class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-xs md:text-sm text-white placeholder-slate-600 focus:outline-none focus:border-indigo-500">
            <button onclick="addByLink()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl text-xs md:text-sm font-medium transition flex items-center gap-1.5 flex-shrink-0">
              <i class="fa-solid fa-paper-plane"></i> Kirim
            </button>
          </div>
        </div>

      </div>

    </section>

    <!-- KOLOM KANAN: Antrean Real-Time -->
    <section class="lg:col-span-5 bg-slate-900/90 border border-slate-800 rounded-2xl p-4 md:p-5 shadow-2xl flex flex-col h-[480px] lg:h-[calc(100vh-120px)]">
      <div class="flex items-center justify-between pb-3 border-b border-slate-800 mb-3 flex-shrink-0">
        <h2 class="text-xs md:text-sm font-bold uppercase tracking-wider text-slate-300 flex items-center gap-2">
          <i class="fa-solid fa-list-ol text-indigo-400"></i> Antrean Real-Time
        </h2>
        <div class="flex items-center gap-2">
          <span id="queueCount" class="text-xs bg-slate-800 text-slate-400 border border-slate-700 px-2.5 py-1 rounded-full font-medium">0 Lagu</span>
          <button onclick="clearAllQueue()" class="text-xs bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/30 px-2.5 py-1 rounded-full font-medium transition flex items-center gap-1" title="Hapus Seluruh Antrean">
            <i class="fa-solid fa-trash"></i> Bersihkan
          </button>
        </div>
      </div>

      <div id="queueList" class="flex-1 overflow-y-auto space-y-2 pr-1 custom-scrollbar"></div>
    </section>

  </main>

  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    // ⚠️ MASUKKAN URL FIREBASE REALTIME DATABASE ANDA DI SINI
    const firebaseConfig = {
      databaseURL: "https://musik-6b437-default-rtdb.asia-southeast1.firebasedatabase.app/"
    };

    let db = null;
    try {
      firebase.initializeApp(firebaseConfig);
      db = firebase.database().ref("jukebox_queue");
    } catch(e) {
      console.warn("Firebase standby");
    }

    let player;
    let playlist = [];
    let currentIndex = -1;

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        height: '100%',
        width: '100%',
        playerVars: { 'autoplay': 1, 'controls': 1, 'rel': 0, 'modestbranding': 1 },
        events: {
          'onStateChange': (e) => { if (e.data === YT.PlayerState.ENDED) playNext(); },
          'onError': () => playNext()
        }
      });
    }

    // Mendengarkan Sinkronisasi Antrean Firebase
    if(db) {
      db.on('value', (snapshot) => {
        const data = snapshot.val();
        playlist = [];
        
        if (data) {
          Object.keys(data).forEach(key => {
            playlist.push({ key: key, ...data[key] });
          });
        }
        
        renderQueue();

        if (playlist.length > 0 && currentIndex === -1) {
          playSong(0);
        }
      });
    }

    function extractVideoId(url) {
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|shorts\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    function switchTab(mode) {
      const searchMode = document.getElementById('searchMode');
      const linkMode = document.getElementById('linkMode');
      const tabSearchBtn = document.getElementById('tabSearchBtn');
      const tabLinkBtn = document.getElementById('tabLinkBtn');

      if (mode === 'search') {
        searchMode.classList.remove('hidden');
        linkMode.classList.add('hidden');
        tabSearchBtn.className = "text-xs md:text-sm font-semibold text-indigo-400 border-b-2 border-indigo-500 pb-1.5 transition flex items-center gap-2";
        tabLinkBtn.className = "text-xs md:text-sm font-medium text-slate-400 border-b-2 border-transparent pb-1.5 hover:text-slate-200 transition flex items-center gap-2";
      } else {
        searchMode.classList.add('hidden');
        linkMode.classList.remove('hidden');
        tabLinkBtn.className = "text-xs md:text-sm font-semibold text-indigo-400 border-b-2 border-indigo-500 pb-1.5 transition flex items-center gap-2";
        tabSearchBtn.className = "text-xs md:text-sm font-medium text-slate-400 border-b-2 border-transparent pb-1.5 hover:text-slate-200 transition flex items-center gap-2";
      }
    }

    // FUNGSI PENCARIAN DENGAN MULTI-SERVER FALLBACK
    async function searchSong() {
      const query = document.getElementById('searchInput').value.trim();
      if (!query) return alert('Ketik judul lagu atau penyanyi!');

      const resultsDiv = document.getElementById('searchResults');
      resultsDiv.innerHTML = `<p class="text-xs text-slate-500 text-center py-3"><i class="fa-solid fa-spinner animate-spin"></i> Mencari lagu di YouTube...</p>`;

      const instances = [
        "https://pipedapi.kavin.rocks",
        "https://pipedapi.privacy.com.de",
        "https://pipedapi.adminforge.de"
      ];

      let data = null;
      for (const instance of instances) {
        try {
          const res = await fetch(`${instance}/search?q=${encodeURIComponent(query)}&filter=videos`, { signal: AbortSignal.timeout(4000) });
          const json = await res.json();
          if (json && json.items && json.items.length > 0) {
            data = json;
            break;
          }
        } catch (e) {
          continue;
        }
      }

      if (!data || !data.items || data.items.length === 0) {
        resultsDiv.innerHTML = `<p class="text-xs text-yellow-500 text-center py-2">Lagu tidak ditemukan atau server sibuk. Silakan gunakan tab Paste Link.</p>`;
        return;
      }

      resultsDiv.innerHTML = '';
      data.items.slice(0, 4).forEach(item => {
        let videoId = '';
        if (item.url) {
          const match = item.url.match(/(?:v=|shorts\/|embed\/|\/)([\w-]{11})/);
          videoId = match ? match[1] : item.url.split('v=')[1] || '';
        }
        const title = item.title || 'Judul Tidak Tersedia';
        const uploader = item.uploaderName || 'YouTube';

        if (videoId) {
          const div = document.createElement('div');
          div.className = "p-2.5 bg-slate-950 rounded-xl border border-slate-800/80 flex items-center justify-between gap-3 hover:border-indigo-500/50 transition";
          div.innerHTML = `
            <div class="min-w-0 flex-1">
              <p class="text-xs font-semibold truncate text-slate-200">${title}</p>
              <p class="text-[10px] text-slate-500 mt-0.5">${uploader}</p>
            </div>
            <button onclick="pushToQueue('${videoId}', '${title.replace(/'/g, "\\'")}')" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1.5 rounded-lg text-xs font-medium transition flex-shrink-0">
              + Tambah
            </button>
          `;
          resultsDiv.appendChild(div);
        }
      });
    }

    function addByLink() {
      const link = document.getElementById('linkInput').value.trim();
      const videoId = extractVideoId(link);
      if (!videoId) return alert('Format link YouTube tidak valid!');

      pushToQueue(videoId, `Video YouTube (${videoId})`);
      document.getElementById('linkInput').value = '';
    }

    function pushToQueue(id, title) {
      const user = document.getElementById('userInput').value.trim() || 'Rekan Kantor';
      const newItem = {
        id: id,
        title: title,
        user: user,
        timestamp: Date.now()
      };

      if(db) {
        db.push(newItem);
      } else {
        playlist.push(newItem);
        renderQueue();
        if (currentIndex === -1) playSong(playlist.length - 1);
      }
    }

    function deleteSong(key, index) {
      if (!confirm('Hapus lagu ini dari antrean?')) return;

      if (db && key) {
        db.child(key).remove();
      } else {
        playlist.splice(index, 1);
        renderQueue();
      }

      if (index === currentIndex) {
        playNext();
      } else if (index < currentIndex) {
        currentIndex--;
      }
    }

    function clearAllQueue() {
      if (playlist.length === 0) return alert('Antrean sudah kosong!');
      if (!confirm('Apakah Anda yakin ingin menghapus SEMUA antrean lagu?')) return;

      if (db) {
        db.remove();
      } else {
        playlist = [];
        renderQueue();
      }

      currentIndex = -1;
      document.getElementById('nowPlayingTitle').innerText = 'Antrean Bersih';
      document.getElementById('nowPlayingUser').innerText = '-';
    }

    function playSong(index) {
      if (index < 0 || index >= playlist.length) return;
      currentIndex = index;
      const item = playlist[currentIndex];

      if (player && player.loadVideoById) {
        player.loadVideoById(item.id);
      }

      document.getElementById('nowPlayingTitle').innerText = item.title || item.id;
      document.getElementById('nowPlayingUser').innerText = `Permintaan oleh: ${item.user}`;
      renderQueue();
    }

    function playNext() {
      if (currentIndex + 1 < playlist.length) {
        playSong(currentIndex + 1);
      } else {
        document.getElementById('nowPlayingTitle').innerText = 'Antrean Selesai';
        document.getElementById('nowPlayingUser').innerText = 'Tambahkan lagu baru ke antrean';
      }
    }

    function renderQueue() {
      const container = document.getElementById('queueList');
      const countBadge = document.getElementById('queueCount');
      container.innerHTML = '';
      countBadge.innerText = `${playlist.length} Lagu`;

      if (playlist.length === 0) {
        container.innerHTML = `
          <div class="text-center py-16 text-slate-600">
            <i class="fa-solid fa-music text-3xl mb-2"></i>
            <p class="text-xs">Antrean musik masih kosong</p>
          </div>
        `;
        return;
      }

      playlist.forEach((item, idx) => {
        const isCurrent = idx === currentIndex;
        const div = document.createElement('div');
        div.className = `p-3 rounded-xl border flex items-center justify-between gap-3 transition ${
          isCurrent 
            ? 'bg-indigo-950/80 border-indigo-500/80 text-white shadow-lg' 
            : 'bg-slate-950/60 border-slate-800/80 text-slate-300 hover:border-slate-700'
        }`;
        
        div.innerHTML = `
          <div class="min-w-0 flex-1 cursor-pointer" onclick="playSong(${idx})">
            <div class="flex items-center gap-2">
              <span class="text-xs font-bold text-slate-500">${idx + 1}.</span>
              <p class="text-xs font-semibold truncate ${isCurrent ? 'text-indigo-300' : 'text-slate-200'}">${item.title || item.id}</p>
            </div>
            <p class="text-[10px] text-slate-500 mt-0.5"><i class="fa-solid fa-user text-[9px] mr-1"></i>${item.user}</p>
          </div>
          <div class="flex items-center gap-2">
            ${isCurrent ? '<i class="fa-solid fa-volume-high text-indigo-400 text-xs animate-pulse mr-1"></i>' : ''}
            <button onclick="deleteSong('${item.key || ''}', ${idx})" class="text-slate-500 hover:text-red-400 p-1.5 rounded-lg hover:bg-slate-800 transition" title="Hapus Lagu">
              <i class="fa-solid fa-trash-can text-xs"></i>
            </button>
          </div>
        `;
        container.appendChild(div);
      });
    }
  </script>
</body>
</html>

```
