<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jukebox Kantor Real-Time</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Firebase SDK (Realtime Database & App) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: linear-gradient(135deg, #090d16 0%, #111827 50%, #090d16 100%);
      min-height: 100vh;
    }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #6366f1; border-radius: 9999px; }
    .glass {
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
  </style>
</head>
<body class="text-slate-100 antialiased selection:bg-indigo-500 selection:text-white p-4 md:p-6 flex flex-col items-center">

  <div class="max-w-xl w-full space-y-6">
    
    <!-- Header -->
    <header class="glass border border-slate-800 rounded-2xl p-4 shadow-xl flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="p-3 bg-gradient-to-tr from-indigo-600 to-violet-500 rounded-xl shadow-lg shadow-indigo-600/30 text-white">
          <i class="fa-solid fa-radio text-xl"></i>
        </div>
        <div>
          <h1 class="text-base md:text-lg font-extrabold tracking-tight text-white">Jukebox Kantor</h1>
          <p class="text-[11px] text-indigo-400 font-medium">Sinkronisasi Real-Time & Pencarian Lagu</p>
        </div>
      </div>
      <div id="statusBadge" class="bg-slate-900 border border-slate-800 text-[11px] px-3 py-1.5 rounded-full flex items-center gap-2 text-slate-300">
        <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
        <span id="statusText">Menghubungkan...</span>
      </div>
    </header>

    <!-- Panel Pemutar YouTube (Main PC / Speaker) -->
    <div class="glass border border-slate-800 rounded-3xl p-4 shadow-2xl space-y-3">
      <div class="relative aspect-video w-full bg-slate-950 rounded-2xl overflow-hidden border border-slate-800 shadow-inner">
        <div id="player" class="w-full h-full"></div>
        <div id="playerPlaceholder" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-950 text-slate-500 p-6 text-center">
          <i class="fa-brands fa-youtube text-5xl mb-2 text-slate-800"></i>
          <p class="text-xs font-medium text-slate-400">Pemutar YouTube Siap</p>
          <p class="text-[10px] text-slate-600 mt-1">Lagu akan berputar otomatis dari antrean</p>
        </div>
      </div>

      <div class="flex items-center justify-between pt-2">
        <div class="min-w-0 flex-1 pr-3">
          <h2 id="nowPlayingTitle" class="text-sm md:text-base font-bold truncate text-white">Belum Ada Lagu Diputar</h2>
          <p id="nowPlayingUser" class="text-xs text-slate-400 mt-0.5">Antrean kosong</p>
        </div>
        <button onclick="playNext()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-4 py-2.5 rounded-xl border border-slate-700/80 transition text-xs font-semibold flex items-center gap-2 shrink-0 active:scale-95">
          <span>Skip</span> <i class="fa-solid fa-forward-step"></i>
        </button>
      </div>
    </div>

    <!-- Form Request & Pencarian Lagu -->
    <div class="glass border border-slate-800 rounded-3xl p-5 shadow-2xl space-y-4">
      <h3 class="text-xs font-bold uppercase tracking-wider text-indigo-400 flex items-center gap-2">
        <i class="fa-solid fa-circle-plus"></i> Tambah / Cari Lagu
      </h3>
      
      <div class="space-y-3">
        <!-- Input Nama Pengirim -->
        <div>
          <label class="block text-[11px] font-semibold text-slate-400 uppercase tracking-wider mb-1">Nama / Divisi Anda</label>
          <div class="relative">
            <i class="fa-solid fa-user absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
            <input type="text" id="userInput" placeholder="Contoh: Budi (IT)" class="w-full bg-slate-950/80 border border-slate-800 rounded-xl pl-9 pr-4 py-2.5 text-xs text-white placeholder-slate-600 focus:outline-none focus:border-indigo-500 transition">
          </div>
        </div>

        <!-- Tab Pilihan: Link YouTube vs Pencarian Judul -->
        <div class="flex rounded-xl bg-slate-950/80 p-1 border border-slate-800 text-xs font-medium">
          <button onclick="switchTab('link')" id="tabLink" class="flex-1 py-2 rounded-lg bg-indigo-600 text-white transition shadow">Paste Link YouTube</button>
          <button onclick="switchTab('search')" id="tabSearch" class="flex-1 py-2 rounded-lg text-slate-400 hover:text-white transition">Cari Judul / Artis</button>
        </div>

        <!-- Mode 1: Input Link -->
        <div id="sectionLink" class="space-y-2">
          <div class="flex gap-2">
            <div class="relative flex-1">
              <i class="fa-brands fa-youtube absolute left-3.5 top-1/2 -translate-y-1/2 text-rose-500 text-sm"></i>
              <input type="text" id="linkInput" placeholder="https://www.youtube.com/watch?v=..." class="w-full bg-slate-950/80 border border-slate-800 rounded-xl pl-10 pr-4 py-2.5 text-xs text-white placeholder-slate-600 focus:outline-none focus:border-indigo-500 transition">
            </div>
            <button onclick="addSongByLink()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-2.5 rounded-xl font-bold text-xs transition flex items-center gap-1.5 shrink-0 shadow-lg shadow-indigo-600/20 active:scale-95">
              <i class="fa-solid fa-plus"></i> Tambah
            </button>
          </div>
        </div>

        <!-- Mode 2: Cari Lagu Berdasarkan Judul -->
        <div id="sectionSearch" class="space-y-2 hidden">
          <div class="flex gap-2">
            <div class="relative flex-1">
              <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
              <input type="text" id="searchInput" placeholder="Ketik judul lagu atau penyanyi (mis: Dewa 19 Kangen)..." class="w-full bg-slate-950/80 border border-slate-800 rounded-xl pl-9 pr-4 py-2.5 text-xs text-white placeholder-slate-600 focus:outline-none focus:border-indigo-500 transition">
            </div>
            <button onclick="searchAndAddSong()" class="bg-violet-600 hover:bg-violet-500 text-white px-5 py-2.5 rounded-xl font-bold text-xs transition flex items-center gap-1.5 shrink-0 shadow-lg shadow-violet-600/20 active:scale-95">
              <i class="fa-solid fa-search"></i> Cari & Putar
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Daftar Antrean Real-Time -->
    <div class="glass border border-slate-800 rounded-3xl p-5 shadow-2xl flex flex-col h-[380px]">
      <div class="flex items-center justify-between mb-3 pb-2 border-b border-slate-800">
        <h3 class="text-xs font-bold uppercase tracking-wider text-slate-300 flex items-center gap-2">
          <i class="fa-solid fa-list-ol text-indigo-400"></i> Antrean Jukebox Bersama
        </h3>
        <span id="queueCount" class="text-[11px] font-bold bg-slate-900 border border-slate-800 text-indigo-300 px-2.5 py-1 rounded-full">0 Lagu</span>
      </div>

      <div id="queueList" class="flex-1 overflow-y-auto space-y-2 pr-1 custom-scrollbar">
        <!-- List Antrean Otomatis -->
      </div>
    </div>

  </div>

  <!-- Setup Konfigurasi Firebase Anda di Sini -->
  <script>
    /* =========================================================================
       INSTRUKSI FIREBASE:
       1. Buat project gratis di https://console.firebase.google.com/
       2. Buat Realtime Database & aktifkan mode Test Mode.
       3. Salin URL database Anda dan masukkan ke variabel `databaseURL` di bawah ini.
       ========================================================================= */
    const firebaseConfig = {
      databaseURL: "https://musik-6b437-default-rtdb.asia-southeast1.firebasedatabase.app/"
    };

    // Inisialisasi Firebase
    let db = null;
    try {
      firebase.initializeApp(firebaseConfig);
      db = firebase.database().ref("office_jukebox_queue");
      updateStatus("Terhubung Real-Time", "bg-emerald-400");
    } catch(e) {
      updateStatus("Mode Offline / URL Belum Diisi", "bg-rose-400");
    }

    let player = null;
    let playlist = [];
    let currentIndex = -1;

    // Load YouTube IFrame API
    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    const firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        height: '100%',
        width: '100%',
        playerVars: { 
          'autoplay': 1, 
          'controls': 1,
          'modestbranding': 1,
          'rel': 0
        },
        events: {
          'onStateChange': (e) => { 
            if (e.data === YT.PlayerState.ENDED) playNext(); 
          },
          'onError': () => {
            setTimeout(() => playNext(), 2000);
          }
        }
      });
    }

    // Sinkronisasi Real-Time dari Firebase Database
    if (db) {
      db.on('value', (snapshot) => {
        const data = snapshot.val();
        playlist = data ? Object.values(data) : [];
        renderQueue();

        if (playlist.length > 0 && currentIndex === -1) {
          playSong(0);
        }
      });
    }

    // Toggle Tab Input (Link vs Pencarian)
    function switchTab(mode) {
      const tabLink = document.getElementById('tabLink');
      const tabSearch = document.getElementById('tabSearch');
      const secLink = document.getElementById('sectionLink');
      const secSearch = document.getElementById('sectionSearch');

      if (mode === 'link') {
        tabLink.className = "flex-1 py-2 rounded-lg bg-indigo-600 text-white transition shadow";
        tabSearch.className = "flex-1 py-2 rounded-lg text-slate-400 hover:text-white transition";
        secLink.classList.remove('hidden');
        secSearch.classList.add('hidden');
      } else {
        tabSearch.className = "flex-1 py-2 rounded-lg bg-violet-600 text-white transition shadow";
        tabLink.className = "flex-1 py-2 rounded-lg text-slate-400 hover:text-white transition";
        secSearch.classList.remove('hidden');
        secLink.classList.add('hidden');
      }
    }

    // Ekstrak ID dari Link YouTube
    function extractVideoId(url) {
      if (!url) return null;
      const str = url.trim();
      if (/^[a-zA-Z0-9_-]{11}$/.test(str)) return str;
      const regExp = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?|shorts)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/;
      const match = str.match(regExp);
      return (match && match[1]) ? match[1] : null;
    }

    // Ambil Judul Video via API Publik (NoEmbed)
    async function fetchTrackTitle(videoId) {
      try {
        const res = await fetch(`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${videoId}`);
        const data = await res.json();
        return data.title || `Lagu YouTube (${videoId})`;
      } catch(e) {
        return `Lagu YouTube (${videoId})`;
      }
    }

    // Tambah lagu via Link YouTube
    async function addSongByLink() {
      const userName = document.getElementById('userInput').value.trim() || 'Rekan Kantor';
      const rawUrl = document.getElementById('linkInput').value.trim();

      const videoId = extractVideoId(rawUrl);
      if (!videoId) {
        alert('Link YouTube tidak valid!');
        return;
      }

      const title = await fetchTrackTitle(videoId);
      pushToQueue(videoId, title, userName);
      document.getElementById('linkInput').value = '';
    }

    // Cari lagu berdasarkan judul/artis menggunakan widget search/inbox NoEmbed & Invidious public instance
    async function searchAndAddSong() {
      const userName = document.getElementById('userInput').value.trim() || 'Rekan Kantor';
      const query = document.getElementById('searchInput').value.trim();

      if (!query) {
        alert('Masukkan judul lagu atau nama artis yang ingin dicari!');
        return;
      }

      // Indikator sedang mencari
      updateStatus("Mencari Lagu...", "bg-amber-400");

      try {
        // Menggunakan pencarian publik API aman untuk mendapatkan video ID pertama yang cocok
        const response = await fetch(`https://pipedapi.kavin.rocks/search?q=${encodeURIComponent(query)}&filter=videos`);
        const data = await response.json();
        
        if (data && data.items && data.items.length > 0) {
          const topResult = data.items[0];
          const videoId = topResult.url.split('=')[1];
          const title = topResult.title;

          pushToQueue(videoId, title, userName);
          document.getElementById('searchInput').value = '';
          updateStatus("Terhubung Real-Time", "bg-emerald-400");
        } else {
          alert('Lagu tidak ditemukan. Coba kata kunci lain.');
          updateStatus("Terhubung Real-Time", "bg-emerald-400");
        }
      } catch (e) {
        // Fallback jika pencarian API gagal: arahkan langsung membuat query ID via penelusuran alternatif
        alert('Gagal mencari otomatis. Silakan gunakan tab "Paste Link YouTube".');
        updateStatus("Terhubung Real-Time", "bg-emerald-400");
      }
    }

    // Kirim data lagu ke Firebase atau local array
    function pushToQueue(videoId, title, userName) {
      const newItem = {
        id: videoId,
        title: title,
        addedBy: userName,
        timestamp: Date.now()
      };

      if (db) {
        db.push(newItem);
      } else {
        playlist.push(newItem);
        renderQueue();
        if (currentIndex === -1) playSong(playlist.length - 1);
      }
    }

    // Putar Lagu
    function playSong(index) {
      if (index < 0 || index >= playlist.length) return;
      currentIndex = index;
      const item = playlist[currentIndex];

      if (player && player.loadVideoById) {
        player.loadVideoById(item.id);
        document.getElementById('playerPlaceholder').classList.add('hidden');
      }

      document.getElementById('nowPlayingTitle').innerText = item.title;
      document.getElementById('nowPlayingUser').innerText = `Diputar oleh: ${item.addedBy}`;
      renderQueue();
    }

    // Putar Lagu Berikutnya
    function playNext() {
      if (currentIndex + 1 < playlist.length) {
        playSong(currentIndex + 1);
      } else {
        currentIndex = -1;
        if (player && player.stopVideo) player.stopVideo();
        document.getElementById('nowPlayingTitle').innerText = 'Antrean Selesai';
        document.getElementById('nowPlayingUser').innerText = 'Tambahkan lagu baru untuk melanjutkan';
        renderQueue();
      }
    }

    // Hapus Lagu dari Antrean
    function removeSong(key) {
      if (db) {
        db.child(key).remove();
      } else {
        // Jika offline
        const idx = playlist.findIndex(item => item.id === key);
        if(idx > -1) {
          playlist.splice(idx, 1);
          renderQueue();
        }
      }
    }

    // Render Antrean Real-Time
    function renderQueue() {
      const container = document.getElementById('queueList');
      const countBadge = document.getElementById('queueCount');
      container.innerHTML = '';

      countBadge.innerText = `${playlist.length} Lagu`;

      if (playlist.length === 0) {
        container.innerHTML = `
          <div class="text-center py-12 text-slate-600">
            <i class="fa-solid fa-music text-3xl mb-2 opacity-30"></i>
            <p class="text-xs font-semibold">Antrean Masih Kosong</p>
            <p class="text-[11px] text-slate-600 mt-0.5">Kirim request lagu pertama Anda!</p>
          </div>
        `;
        return;
      }

      // Ambil objek database keys jika menggunakan firebase
      if (db) {
        db.once('value', (snapshot) => {
          const val = snapshot.val() || {};
          const keys = Object.keys(val);
          
          playlist.forEach((item, index) => {
            const isCurrent = index === currentIndex;
            const key = keys[index];
            createQueueCard(item, index, isCurrent, key);
          });
        });
      } else {
        playlist.forEach((item, index) => {
          const isCurrent = index === currentIndex;
          createQueueCard(item, index, isCurrent, item.id);
        });
      }
    }

    function createQueueCard(item, index, isCurrent, key) {
      const container = document.getElementById('queueList');
      const div = document.createElement('div');
      div.className = `p-3 rounded-2xl border transition flex items-center justify-between gap-3 ${
        isCurrent 
          ? 'bg-indigo-600/20 border-indigo-500/50 text-white shadow-lg' 
          : 'bg-slate-950/60 border-slate-800/80 hover:border-slate-700 text-slate-300'
      }`;

      div.innerHTML = `
        <div class="min-w-0 flex-1 cursor-pointer" onclick="playSong(${index})">
          <div class="flex items-center gap-2">
            ${isCurrent ? '<i class="fa-solid fa-volume-high text-xs text-indigo-400 animate-pulse shrink-0"></i>' : '<span class="text-[10px] text-slate-600 font-mono w-3 text-center shrink-0">' + (index + 1) + '</span>'}
            <p class="text-xs font-bold truncate ${isCurrent ? 'text-indigo-300' : 'text-slate-200'}">${item.title}</p>
          </div>
          <p class="text-[10px] text-slate-400 mt-1 pl-5">
            Request oleh: <span class="font-semibold text-slate-300">${item.addedBy}</span>
          </p>
        </div>
        <button onclick="removeSong('${key}')" class="text-slate-500 hover:text-rose-400 p-1.5 rounded-xl transition" title="Hapus">
          <i class="fa-solid fa-trash-can text-xs"></i>
        </button>
      `;
      container.appendChild(div);
    }

    function updateStatus(text, colorClass) {
      document.getElementById('statusText').innerText = text;
      const indicator = document.querySelector('#statusBadge span');
      indicator.className = `w-2 h-2 rounded-full ${colorClass} animate-pulse`;
    }
  </script>
</body>
</html>
